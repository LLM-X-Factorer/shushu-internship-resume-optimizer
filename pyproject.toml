[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shushu"
version = "2.0.0"
description = "Generate aijobfit internship case-study blog posts (.tsx) from a desensitized project description."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "shushu contributors" }
]
dependencies = [
  "anthropic>=0.40"
]

[project.optional-dependencies]
dev = [
  "pytest>=8"
]

[project.scripts]
shushu-generate-case = "shushu.generate_case:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shushu*"]

[tool.setuptools.package-data]
shushu = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
